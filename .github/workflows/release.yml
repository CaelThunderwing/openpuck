name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-release:
    if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    env:
      SEMVER_RE: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate pushed tag is semver
        if: github.event_name == 'push'
        run: |
          echo "${GITHUB_REF_NAME}" | grep -Eq "${SEMVER_RE}"

      - name: Resolve release version
        id: release_version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.5.1'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install pinned adafruit-nrfutil
        run: python -m pip install 'adafruit-nrfutil==0.5.3.post16'

      - name: Install Adafruit nRF52 core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://adafruit.github.io/arduino-board-index/package_adafruit_index.json
          arduino-cli core update-index
          arduino-cli core install adafruit:nrf52@1.7.0

      - name: Verify pinned build toolchain
        run: |
          arduino-cli version
          arduino-cli version | grep -F 'Version: 1.5.1'
          arduino-cli core list
          arduino-cli core list | awk '$1 == "adafruit:nrf52" && $2 == "1.7.0" { found=1 } END { exit !found }'
          adafruit-nrfutil version
          adafruit-nrfutil version | grep -F '0.5.3.post16'

      - name: Generate version header
        env:
          OPK_BUILD_VERSION: ${{ steps.release_version.outputs.version }}
        run: ./gen_version.sh

      - name: Compile OpenPuck
        run: |
          mkdir -p build/openpuck build/cache/openpuck
          make build BUILD_PATH=build/cache/openpuck OUTPUT_DIR=build/openpuck

      - name: Generate UF2 (standard)
        run: ./gen_uf2.sh build/openpuck/OpenPuck.ino.hex build/openpuck/OpenPuck.ino.uf2

      - name: Compile ReversePuckFirmware
        run: |
          mkdir -p build/reversepuck build/cache/reversepuck
          make reversepuck BUILD_PATH=build/cache/reversepuck OUTPUT_DIR=build/reversepuck

      - name: Generate UF2 (ReversePuckFirmware)
        run: ./gen_uf2.sh build/reversepuck/ReversePuckFirmware.ino.hex build/reversepuck/ReversePuckFirmware.ino.uf2

      - name: Compile recovery build
        run: |
          mkdir -p build/openpuck-recovery build/cache/openpuck-recovery
          make build-recovery BUILD_PATH=build/cache/openpuck-recovery OUTPUT_DIR=build/openpuck-recovery

      - name: Generate UF2 (recovery)
        run: ./gen_uf2.sh build/openpuck-recovery/OpenPuck.ino.hex build/openpuck-recovery/OpenPuck.ino.uf2

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          mkdir -p release_assets

          find build/openpuck build/openpuck-recovery \
            -maxdepth 1 -type f \
            \( -name '*.uf2' -o -name '*.hex' \) \
            -print | while read -r f; do
            # Keep only the extension; the arduino base name (OpenPuck.ino.*)
            # is redundant once we prefix with OpenPuck-<version>-<flavor>.
            ext="${f##*.}"
            dir="$(basename "$(dirname "$f")")"
            if [ "$dir" = "openpuck-recovery" ]; then
              flavor="factory-reset"
            else
              flavor="standard"
            fi
            cp "$f" "release_assets/OpenPuck-${VERSION}-${flavor}.${ext}"
          done

          find build/reversepuck \
            -maxdepth 1 -type f \
            \( -name '*.uf2' -o -name '*.hex' \) \
            -print | while read -r f; do
            ext="${f##*.}"
            cp "$f" "release_assets/ReversePuckFirmware-${VERSION}.${ext}"
          done
          test -n "$(find release_assets -maxdepth 1 -type f -print -quit)"
          (
            cd release_assets
            sha256sum ./*.uf2 ./*.hex > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          ls -la release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_version.outputs.version }}
          name: ${{ format('OpenPuck {0}', steps.release_version.outputs.version) }}
          prerelease: false
          files: release_assets/*
          body: |
            OpenPuck Firmware Release

            Version: ${{ steps.release_version.outputs.version }}
            Commit: ${{ github.sha }}

            ### Highlights

            - Original Xbox Controller S console mode (mode 10).
            - Xbox 360 Console mode (mode 11) with full retail XSM3 authentication.
            - Mode 11 validated on stock and RGH Xbox 360 consoles without `UsbdSecPatch`.
            - Hotplug, cold boot, player-ring assignment, digital inputs, analog sticks, stick clicks, rumble, and sustained gameplay validated.
            - Mode 11 Steam-button power-on validated on stock and RGH consoles when the puck remains connected after an active USB session. First plugging the puck into an already fully powered-off console cannot wake it.
            - Persistent HardFault, watchdog, boot-history, and USB diagnostics.
            - Release build pinned to Arduino CLI 1.5.1, Adafruit nRF52 core 1.7.0, and adafruit-nrfutil 0.5.3.post16.

            ### WebUSB Panel

            The upstream hosted Panel does not contain this fork's mode 10 and mode 11 buttons. Follow the [local WebUSB instructions](https://github.com/${{ github.repository }}/blob/${{ steps.release_version.outputs.version }}/docs/BUILD_AND_DEPLOY.md#8-run-the-webusb-app-locally) to use this repository's Panel.

            USB mode changes re-enumerate the device. If Windows temporarily loses Panel access, return to Steam mode with back-4 + A and reconnect the Puck.

            ### Files included

            - `OpenPuck-*-standard.*` — standard Puck firmware.
            - `OpenPuck-*-factory-reset.*` — one-time factory-reset build; re-pair afterward.
            - `ReversePuckFirmware-*.*` — ReversePuck controller-emulator firmware.
            - `.uf2` files — drag-and-drop flashing through the BOOT/UF2 drive.
            - `.hex` files — direct flashing workflows.
            - `SHA256SUMS` — checksums for every published firmware asset.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror OpenPuck UF2s to the firmware branch
        # The WebUSB panel's "update from a release" flow downloads these in-browser. GitHub's release-asset
        # CDN (release-assets.githubusercontent.com) sends no CORS headers, so browsers cannot fetch release
        # assets directly; raw.githubusercontent.com IS CORS-clean. Mirror the puck .uf2s onto the orphan
        # `firmware` branch, where the panel fetches raw.githubusercontent.com/<repo>/firmware/<asset-name>.
        # Isolated clone in a temp dir so the build tree (untracked artifacts, regenerated version header)
        # can't leak into the mirror commit.
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          MIRROR="$(mktemp -d)/mirror"
          REPO="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code "$REPO" refs/heads/firmware >/dev/null 2>&1; then
            git clone --depth 1 --branch firmware "$REPO" "$MIRROR"
          else
            git init "$MIRROR"
            git -C "$MIRROR" checkout --orphan firmware
            git -C "$MIRROR" remote add origin "$REPO"
            printf '%s\n' \
              '# firmware mirror' '' \
              'OpenPuck release `.uf2` files, mirrored from the GitHub release assets because' \
              'raw.githubusercontent.com serves files WITH CORS headers while the release-asset CDN does' \
              'not — this is what lets the WebUSB config panel download and flash releases in-browser.' \
              'Maintained automatically by `.github/workflows/release.yml`; do not edit by hand.' \
              > "$MIRROR/README.md"
          fi
          cp release_assets/OpenPuck-"${VERSION}"-*.uf2 "$MIRROR"/
          # manifest.json: name -> {panelUpdate}. Decode UF2 payload blocks before looking for FWUP_TAG:
          # a capability string may cross a 256-byte payload boundary and is then interrupted by the next
          # UF2 container header even though it is contiguous in flash.
          python3 "$GITHUB_WORKSPACE/tools/update_firmware_manifest.py" "$MIRROR"
          git -C "$MIRROR" config user.name "github-actions[bot]"
          git -C "$MIRROR" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$MIRROR" add -A
          if git -C "$MIRROR" diff --cached --quiet; then
            echo "firmware mirror already contains OpenPuck ${VERSION}"
          else
            git -C "$MIRROR" commit -m "mirror OpenPuck ${VERSION} uf2s for the panel updater"
            git -C "$MIRROR" push origin firmware
          fi
